<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Soma de Dígitos</title>
</head>
<body>
    <input type="number" id="num">
    <button onclick="somaDigitos()">Calcular</button>
    <div id="resultado"></div>
    <script>
    function somaDigitos() {
        let num = parseInt(document.getElementById("num").value);
        let soma = 0;
        while (num > 0) {
            soma += num % 10;
            num = Math.floor(num / 10);
        }
        document.getElementById("resultado").innerText = "Soma: " + soma;
    }
    </script>
</body>
</html>
